[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qae-european"
version = "1.0.0"
description = "Amplitude-estimation pricing of a European call, benchmarked against Black-Scholes, Monte Carlo and quasi-Monte Carlo"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["qiskit>=1.2,<3", "numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=8"]
docs = ["matplotlib>=3.8", "pylatexenc>=2.10"]

[project.scripts]
qae-european = "qae_european.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
